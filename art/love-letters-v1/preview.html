<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A little team effort — Lobs of Love</title>
<style>
:root{color-scheme:light;font-family:Helvetica,Arial,sans-serif;background:#eee9df;color:#343c3a}*{box-sizing:border-box}body{margin:0}main{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:28px 24px 22px}header,footer{width:min(100%,900px);display:flex;justify-content:space-between;align-items:center;gap:20px}header{font-size:10px;letter-spacing:2px;text-transform:uppercase}header span:last-child{opacity:.5}section{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}canvas{display:block;width:min(100%,78svh,900px);aspect-ratio:1}footer{font-size:11px;gap:26px}button{font:inherit;color:inherit;background:none;border:0;padding:12px 0;cursor:pointer;white-space:nowrap}button:hover{color:#ac4830}button:focus-visible,input:focus-visible{outline:1px solid #ac4830;outline-offset:5px}.controls{display:flex;align-items:center;gap:20px}input{width:clamp(80px,20vw,200px);height:2px;accent-color:#747e6c;cursor:pointer}.caption{font-family:Georgia,serif;font-size:17px;font-style:italic}.time{font-variant-numeric:tabular-nums;min-width:30px;opacity:.5}@media(max-width:600px){main{padding:24px 18px}header{font-size:9px;letter-spacing:1.5px}footer{flex-wrap:wrap;gap:10px}.controls{width:100%;justify-content:space-between}input{flex:1}.caption{font-size:16px}canvas{width:100%}}
</style>
</head>
<body><main><header><span>Lobs of Love / Drawing studies</span><span>03 — A little team effort</span></header><section><canvas aria-label="Colored strokes draw a tennis ball. Six limbless fighters work in two teams to shuffle and tip a large L and mirrored L into place, and Lobs of Love writes itself in an arch above."></canvas></section><footer><span class="caption">Everybody, on three.</span><div class="controls"><button id="play">Pause</button><button id="replay">Redraw</button><a href="?short" style="color:inherit;font-size:11px">Startup cut</a><a href="preview.html" style="color:inherit;font-size:11px">Full cut</a><input id="seek" aria-label="Drawing progress" type="range" min="0" max="24" step="0.01" value="0"><span class="time" id="time">00</span></div></footer></main>
<script src="../../web/love-intro.js"></script><script>
const canvas=document.querySelector('canvas'),seek=document.querySelector('#seek'),play=document.querySelector('#play');
const scene=createLoveIntro(canvas),short=new URLSearchParams(location.search).has('short');
const DURATION=short?4.2:24;
seek.max=DURATION;
let elapsed=matchMedia('(prefers-reduced-motion: reduce)').matches?DURATION*.85:0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
function draw(){if(short){scene.draw(30,{titleTime:23+elapsed});canvas.style.opacity=String(Math.min(1,elapsed/.65));}else scene.draw(Math.min(30,elapsed*1.5));window.__state=scene.getState();seek.value=elapsed;document.querySelector('#time').textContent=elapsed.toFixed(1);}
function sync(){play.textContent=playing?'Pause':'Play';}
play.onclick=()=>{playing=!playing;sync();};document.querySelector('#replay').onclick=()=>{elapsed=0;playing=true;sync();draw();};seek.oninput=()=>{elapsed=Number(seek.value);playing=false;sync();draw();};
window.renderAt=t=>{elapsed=Math.max(0,Math.min(DURATION,t));playing=false;sync();draw();};
function frame(now){if(playing)elapsed=(elapsed+Math.min((now-last)/1000,.05))%DURATION;last=now;if(playing)draw();requestAnimationFrame(frame);}sync();draw();window.__ready=true;requestAnimationFrame(frame);
</script></body></html>
