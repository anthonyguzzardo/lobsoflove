<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The courtyard — Lobs of Love</title>
<style>
:root{color-scheme:light;--paper:#f5e7cc;--ink:#302e25;--red:#a33c27}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,'Times New Roman',serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid var(--red);outline-offset:4px}
#scene{position:relative;width:min(100%,calc(100dvh * .563));height:100%;overflow:hidden;isolation:isolate;background:var(--paper)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
header{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 15px) 18px 40px;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:start;gap:8px;background:linear-gradient(var(--paper),rgba(245,231,204,.86) 65%,transparent);pointer-events:none}
header button{pointer-events:auto;border:0;background:none;min-width:44px;min-height:44px;padding:4px;font:11px ui-monospace,monospace}
.title{text-align:center;padding-top:9px}.eyebrow{font:9px ui-monospace,monospace;letter-spacing:.19em;text-transform:uppercase}h1{font-weight:normal;font-size:26px;line-height:1.1;margin:5px 0 0}
#count{position:absolute;top:calc(env(safe-area-inset-top,0px) + 85px);left:0;right:0;text-align:center;font:10px ui-monospace,monospace;letter-spacing:.12em;text-shadow:0 0 6px var(--paper),0 0 12px var(--paper)}
#call{position:absolute;top:45%;left:0;right:0;text-align:center;pointer-events:none;font-size:25px;font-style:italic;color:#fff6de;text-shadow:0 1px 4px #304f3a;transition:opacity .2s;opacity:0}
#call.show{opacity:1}
footer{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:30px 22px calc(env(safe-area-inset-bottom,0px) + 18px);background:linear-gradient(transparent,var(--paper) 42%);pointer-events:none}
#instruction{font-size:16px;margin:0 0 5px}#detail{font-size:11px;line-height:1.5;margin:0;opacity:.74}
.actions{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:13px;pointer-events:auto}.actions button{background:none;border:0;border-bottom:1px solid #796c55;padding:8px 2px;min-height:40px;font:10px ui-monospace,monospace;letter-spacing:.1em}
#begin{font-size:14px;letter-spacing:0;background:var(--ink);color:var(--paper);border:0;padding:13px 28px;min-height:46px;border-radius:2px}
[hidden]{display:none!important}#error{position:absolute;inset:30% 10%;background:var(--paper);padding:24px;text-align:center}
#pause[hidden]{display:block!important;visibility:hidden}
@media(min-width:850px){body:before{content:'LOBS OF LOVE';position:absolute;left:32px;top:32px;font:10px ui-monospace,monospace;letter-spacing:.2em}body:after{content:'A little afternoon tennis.';position:absolute;right:28px;bottom:32px;font-style:italic;font-size:16px}#scene{box-shadow:0 0 100px #63583a22}}
@media(prefers-reduced-motion:reduce){#call{transition:none}}
</style>
</head>
<body>
<main id="scene" aria-label="Illustrated courtyard tennis">
<canvas id="court" tabindex="0" aria-label="Tennis court. Hold then release after the bounce to hit. Drag sideways to aim. Keyboard: hold and release Space to hit, arrow keys to aim."></canvas>
<header><button id="back" aria-label="Back to drill mode">Back</button><div class="title"><div class="eyebrow">Lobs of Love / study 01</div><h1>The courtyard</h1></div><button id="pause" aria-label="Pause practice" hidden>Pause</button></header>
<div id="count">A FOREHAND IN THE AFTERNOON</div>
<div id="call" role="status" aria-live="polite"></div>
<footer><p id="instruction">Find a little rhythm.</p><p id="detail">Ten easy feeds. We take care of the footwork.<br>Hold, then release after the bounce. Drag sideways to aim.</p><div class="actions"><button id="begin" disabled>Preparing the court...</button><button id="sound" aria-pressed="false">Sound off</button></div></footer>
<div id="error" role="alert" hidden>The artwork could not load. Please reopen the courtyard.</div>
</main>
<!-- COURTYARD_SCRIPT -->
</body>
</html>
