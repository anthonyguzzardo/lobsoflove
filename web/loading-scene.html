<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee9df}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,100vh);height:min(100vw,100vh)}
</style></head><body><canvas role="img" aria-label="Lobs of Love artwork with a handwritten name. Replay shows the fighters assembling the logo."></canvas>
<script>__DRAWING__</script><script>
'use strict';
const config=__CONFIG__;
const scene=createLoveIntro(document.querySelector('canvas'));
const fullReplay=config.fullReplay===true;
const duration=config.reduced?.15:fullReplay?22:4.2;
let elapsed=0,last=null,raf=0,hostActive=config.active!==false,complete=false;
function tell(type){const data=JSON.stringify({source:'lol-loading',type});if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(data);else window.parent.postMessage(data,'*');}
function render(){
 const canvas=document.querySelector('canvas');
 canvas.style.opacity=config.reduced||fullReplay?'1':String(Math.min(1,elapsed/.65));
 if(config.reduced)scene.draw(30);
 else if(fullReplay)scene.draw(Math.min(30,elapsed*1.5));
 else scene.draw(30,{titleTime:23+elapsed});
}
function tick(now){raf=0;if(!hostActive||document.hidden||complete)return;if(last!==null)elapsed+=Math.min((now-last)/1000,.1);last=now;try{render();if(elapsed>=duration){complete=true;scene.draw(30);tell('complete');return;}raf=requestAnimationFrame(tick);}catch{complete=true;tell('error');}}
function schedule(){cancelAnimationFrame(raf);raf=0;last=null;if(hostActive&&!document.hidden&&!complete)raf=requestAnimationFrame(tick);}
window.setLoadingActive=value=>{hostActive=Boolean(value);schedule();};
window.addEventListener('message',e=>{if(e.source!==window.parent)return;try{const m=JSON.parse(e.data);if(m.source==='lol-loading-control')window.setLoadingActive(m.active);}catch{}});
document.addEventListener('visibilitychange',schedule);
window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);});
try{render();tell('ready');schedule();}catch{tell('error');}
</script></body></html>
